[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"
  PUBLIC_APP_URL = "https://app.apnagalla.in"
  PUBLIC_API_URL = "https://api.apnagalla.in"
  PUBLIC_SITE_URL = "https://apnagalla.in"

[[redirects]]
  from = "/api/*"
  to = "https://api.apnagalla.in/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
