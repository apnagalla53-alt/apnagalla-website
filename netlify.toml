[build]
  base = "marketing-site"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"
  PUBLIC_APP_URL = "https://app.apnagalla.in"
  PUBLIC_API_URL = "https://api.apnagalla.in"
  PUBLIC_SITE_URL = "https://apnagalla.in"

[[redirects]]
  from = "https://www.apnagalla.in/*"
  to = "https://apnagalla.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://api.apnagalla.in/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; img-src 'self' data: https://*.googleusercontent.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.apnagalla.in https://accounts.google.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://accounts.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
